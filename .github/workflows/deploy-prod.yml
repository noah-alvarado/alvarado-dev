name: Deploy Prod

on:
  push:
    branches: [main]

# Serialize prod deploys so concurrent merges can't interleave S3 syncs.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write # OIDC -> AWS
  contents: write # push the release tag

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Pull bucket / distribution names straight from the stack outputs.
      - uses: ./.github/actions/stack-outputs

      - name: Deploy to production
        run: node scripts/deploy-prod.mjs

      # Only on a successful deploy: tag the release (a real, rollback-able point).
      - name: Tag the release
        run: |
          TAG="release-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Production release of $GITHUB_SHA"
          git push origin "$TAG"
