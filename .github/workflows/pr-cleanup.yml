name: PR Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  id-token: write # OIDC -> AWS
  contents: read

jobs:
  cleanup-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # needed for the local composite action
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: ./.github/actions/stack-outputs
      - name: Remove preview objects
        run: aws s3 rm "s3://$PREVIEW_BUCKET/pr-${{ github.event.number }}" --recursive
