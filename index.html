<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png?v=20260809" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg?v=20260809" />
    <link rel="shortcut icon" href="/favicon/favicon.ico?v=20260809" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png?v=20260809" />
    <meta name="apple-mobile-web-app-title" content="Alvarado" />
    <link rel="manifest" href="/favicon/site.webmanifest?v=20260809" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>alvarado.dev</title>
    <!-- Applies the stored/preferred theme before React loads to avoid a
         dark-mode flash; keep in sync with src/hooks/useTheme.js. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          if (theme !== 'dark' && theme !== 'light') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
